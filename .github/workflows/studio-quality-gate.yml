name: studio-quality-gate

on:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'tools/**'
      - '.github/workflows/studio-quality-gate.yml'
      - 'turbo.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile 2>&1 | tail -5

      - name: Build packages (core first, then dependents)
        run: |
          pnpm --filter @sentineltwin/core build 2>&1 | tail -5
          pnpm --filter @sentineltwin/simulation build 2>&1 | tail -5
          pnpm --filter @sentineltwin/report build 2>&1 | tail -5
          pnpm --filter @sentineltwin/agents build 2>&1 | tail -5

      - name: Typecheck packages
        run: |
          pnpm --filter @sentineltwin/core typecheck
          pnpm --filter @sentineltwin/simulation typecheck
          pnpm --filter @sentineltwin/report typecheck
          pnpm --filter @sentineltwin/agents typecheck

      - name: Studio quality gate
        run: ./tools/studio-quality-gate.sh
