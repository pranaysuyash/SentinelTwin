  - id: stack_h_minicpm_ocr
    status: active
    pipeline_kind: hybrid
    provider: local
    description: MiniCPM-V 4.6 floorplan parser with OCR assist.
    components:
      ocr:
        model_id: stepfun-ai/GOT-OCR2_0
        role: symbol_and_label_extraction
      vlm:
        model_id: openbmb/MiniCPM-V-4_6
        role: primary_layout_parser
    stage_roles:
      ocr: stepfun-ai/GOT-OCR2_0
      layout: openbmb/MiniCPM-V-4_6
    expected_strengths:
      - compact local multimodal baseline
      - fast iteration on smaller hardware
    known_risks:
