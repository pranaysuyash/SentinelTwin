version: 0.2
updated_at: 2026-05-29

candidates:
  - id: stack_a_qwen_ocr
    status: active
    pipeline_kind: hybrid
    provider: local
    description: Qwen2.5-VL floorplan parser with OCR assist and optional grounding pass.
    components:
      ocr:
        model_id: stepfun-ai/GOT-OCR2_0
        role: symbol_and_label_extraction
      vlm:
        model_id: Qwen/Qwen2.5-VL-7B-Instruct
        role: primary_layout_parser
      detector:
        model_id: IDEA-Research/grounding-dino-base
        role: optional_symbol_grounding
    stage_roles:
      ocr: stepfun-ai/GOT-OCR2_0
      layout: Qwen/Qwen2.5-VL-7B-Instruct
      grounding: IDEA-Research/grounding-dino-base
    cloud_fallbacks:
      - gpt-4.1
      - gemini-2.5-flash
    expected_strengths:
      - strong multimodal reasoning for mixed floorplan styles
      - robust fallback when symbol legend is sparse
    known_risks:
      - may produce over-confident inferred geometry on noisy scans
      - requires strict schema-constrained prompting and post-validation

  - id: stack_b_florence_gotocr
    status: active
    pipeline_kind: hybrid
    provider: local
    description: Florence-2 prompt-task parser with OCR assist.
    components:
      ocr:
        model_id: stepfun-ai/GOT-OCR2_0
        role: text_and_symbol_reading
      vlm:
        model_id: microsoft/Florence-2-base
        role: task_prompted_detection_and_region_parsing
    stage_roles:
      ocr: stepfun-ai/GOT-OCR2_0
      layout: microsoft/Florence-2-base
    cloud_fallbacks:
      - gpt-4o
      - gemini-2.5-pro
    expected_strengths:
      - explicit task control via Florence prompts
      - easier parse normalization using processor post-processing
    known_risks:
      - weaker spatial consistency unless multi-stage prompt flow is tuned

  - id: stack_c_raster2seq_plus_qwen_repair
    status: active
    pipeline_kind: hybrid
    provider: local
    description: Floorplan-native polygon reconstruction with semantic repair pass.
    components:
      vectorizer:
        model_id: haopt/Raster2Seq
        role: polygon_sequence_reconstruction
      semantic_repair:
        model_id: Qwen/Qwen2.5-VL-7B-Instruct
        role: class_label_cleanup_and_security_mapping
    stage_roles:
      layout: haopt/Raster2Seq
      repair: Qwen/Qwen2.5-VL-7B-Instruct
    cloud_fallbacks:
      - gpt-4.1
      - gemini-2.5-pro
    expected_strengths:
      - potentially strongest wall/room geometry extraction on clean plans
      - output shape aligned with downstream vector mapping
    known_risks:
      - may degrade sharply on low-quality scans or non-standard notation

  - id: stack_d_gpt54_nano
    status: active
    pipeline_kind: cloud
    provider: openai
    description: GPT-5.4 Nano direct floorplan parser for latency-sensitive cloud fallback.
    components:
      vlm:
        model_id: gpt-5.4-nano
        role: primary_layout_parser
    cloud_fallbacks:
      - gpt-4o
      - gpt-4.1
    expected_strengths:
      - lower latency than GPT-4o
      - useful speed baseline for ambiguous scans
    known_risks:
      - narrower context window than larger cloud models
      - may under-extract tiny symbols and dense obstructions

  - id: stack_e_gpt41_structured
    status: active
    pipeline_kind: cloud
    provider: openai
    description: GPT-4.1 structured-output fallback for hard or ambiguous scans.
    components:
      vlm:
        model_id: gpt-4.1
        role: structured_layout_and_repair
    cloud_fallbacks:
      - gpt-4o
      - gemini-2.5-pro
    expected_strengths:
      - strong instruction following
      - good schema obedience
    known_risks:
      - still needs prompt discipline for line geometry

  - id: stack_f_gemini25_flash
    status: active
    pipeline_kind: cloud
    provider: gemini
    description: Gemini 2.5 Flash fast cloud fallback.
    components:
      vlm:
        model_id: gemini-2.5-flash
        role: fast_multimodal_fallback
    cloud_fallbacks:
      - gemini-2.5-pro
      - gpt-4.1
    expected_strengths:
      - fast multimodal pass
      - cheap ambiguity triage
    known_risks:
