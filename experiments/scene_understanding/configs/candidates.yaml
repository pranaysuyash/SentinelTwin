      - processor quirks can affect output formatting

  - id: stack_h_minicpmv46
    status: active
    pipeline_kind: end_to_end
    provider: local
    description: MiniCPM-V 4.6 edge VLM (1.3B params, Apache 2.0).
    components:
      vlm:
        model_id: openbmb/MiniCPM-V-4.6
        role: primary_layout_parser
    expected_strengths:
      - ultra-efficient (1.3B params, 4x/16x token compression)
      - phone-deployable (iOS/Android/HarmonyOS)
      - strong for its size on OCR, RefCOCO, OCRBench
    known_risks:
      - small param count may miss fine details on dense floor plans
      - requires transformers>=5.7.0

  - id: stack_i_qwen35_4b
    status: active
    pipeline_kind: end_to_end
    provider: local
    description: Qwen3.5-4B natively multimodal (4B params, Apache 2.0).
    components:
      vlm:
        model_id: Qwen/Qwen3.5-4B
        role: primary_layout_parser
    expected_strengths:
      - natively multimodal (no separate VL variant needed)
      - strong benchmark scores for 4B class
      - Apache 2.0 license
    known_risks:
      - larger than MiniCPM-V 4.6, slower inference on MPS
      - untested on floor plan extraction

  - id: stack_j_minicpmo45
    status: active
    pipeline_kind: end_to_end
    provider: local
    description: MiniCPM-o 4.5 omnimodal VLM (9B params, Apache 2.0).
    components:
      vlm:
        model_id: openbmb/MiniCPM-o-4.5
        role: primary_layout_parser
    expected_strengths:
      - strongest open-source VLM near 9B
      - approaches Gemini 2.5 Flash quality on benchmarks
      - Apache 2.0 license
    known_risks:
      - 9B params may require GPU with >=8GB VRAM
      - slower inference on MPS vs dedicated GPU

  - id: stack_k_gemma4_e4b
    status: active
    pipeline_kind: end_to_end
    provider: local
    description: Gemma 4 E4B MoE VLM (4B active / ~30B total, 128K context).
    components:
      vlm:
        model_id: google/gemma-4-e4b-it
        role: primary_layout_parser
    expected_strengths:
      - MoE efficiency (4B active params, uses only what it needs)
      - natively multimodal (SigLIP2 vision encoder)
      - 128K context window
    known_risks:
      - ~30B total params needs quantization for consumer GPUs
      - Gemma license (ok for Apache 2.0 projects)

deprioritized:
  - reason: license_unclear_or_restrictive
  - reason: community_finetune_without_reliable_eval_card
  - reason: opaque_end_to_end_output_without_intermediate_artifacts
