  - id: stack_g_gemini25_pro
    status: active
    pipeline_kind: cloud
    provider: gemini
    description: Gemini 2.5 Pro high-ceiling cloud fallback.
    components:
      vlm:
        model_id: gemini-2.5-pro
        role: high_accuracy_multimodal_fallback
    cloud_fallbacks:
      - gemini-2.5-flash
      - gpt-4o
    expected_strengths:
      - strongest cloud ceiling for hard scans
